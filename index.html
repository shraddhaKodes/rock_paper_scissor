<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .header{
        height:8vh;
        color:aliceblue;
        text-align:center;
        background-color: #495159;
        padding: 5px;
        display: flex;
        flex-direction:row;
        justify-content: center;
        align-items: center;
        margin-bottom: 4vh;
    }
    .choice_container{
        height:30vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .choices{
        height:22vh;
        width:80%;
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
    }
    .choice{
        height:200px;
        width:200px;
        border-radius:50%;
        border: 1px solid black;
    }
    .choice:hover{
        border:3px solid black;
    }
    #rock{
        background-image: url("rock.png");
        background-size: cover;
        background-position: center;
    }
    #paper{
        background-image: url("paper.png");
        background-size: cover;
        background-position: center;
    }
    #scissor{
        background-image: url("scissor.png");
        background-size: cover;
        background-position: center;
    }
    .Score{
        margin:4%;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
       
    }
    .score_container{
        width:40vw;
        height: auto;
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        border: 1px solid black;
    }
    .self_score , .computer_score{
        text-align: center;
    }
    p{
        font-size: 150%;
        margin:3px;
    }
    h2{
        margin:2px;
    }
    .button{
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .btn{
        margin-top: 2vh;
        height:7vh;
        width: 25%;
        background-color: #303133;
        color:white;
        border: 2px solid rgb(202, 190, 190);
        font-size: 3vh;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        border-radius: 2vh;
    }
    .reset{
        color:white;
        background-color: #020a1a;
        border:3px solid white;
        border-radius:10px;
        height: auto;
        padding: 10px;
        margin: 20px;
    }

    @media(max-width:500px){
        h1{
            font-size: 20px;
        }
        .choices{
            width:95%;
        }
        .choice{
            height:90px;
            width:90px;
        }
        .Score{
            margin: 4%;
            border: 1px solid black;
        }
        .score_container{
            width:70vw;
            border: none;
        }
        .btn{
            width:80%;
        }
    }
</style>
<body>
    <div class="header">
        <h1 style="font-family:emoji;  font-weight:2px;  color:black ; text-shadow: 1px 1px 10px white;">Rock , Paper And Scissors </h1>
    </div>
   <div class="choice_container">
    <div class="choices">
        <div class="choice" id = "rock"></div>
        <div class="choice" id = "paper"></div>
        <div class="choice" id = "scissor"></div>
    </div>
   </div>
   <div class="Score">
    <div class="score_container">
        <div class="self_score" >
            <p class="user_self_score">0</p>
            <h2>You</h2>
        </div>
        <div class="computer_score">
            <p class="computer_self_score">0</p>
            <h2>Comp</h2>
        </div>
       </div>
   </div>
   <div class="button">
    <button class="btn">Play your next move</button>
   </div>

   <div class="reset_btn" style="display:flex; justify-content:center;">
    <button class="reset">Reset</button>
   </div>
   <script src="script.js"></script>
</body>
</html>
